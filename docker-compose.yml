services:
  app:
    container_name: secgenie-api
    build:
      context: .
      dockerfile: Dockerfile

    image: secgenie-ai:dev

    restart: unless-stopped

    command: >
      poetry run uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - .:/app

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - secgenie-network

  postgres:
    container_name: secgenie-postgres

    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: secgenie
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - secgenie-network

  redis:
    container_name: secgenie-redis

    image: redis:7-alpine

    restart: unless-stopped

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    networks:
      - secgenie-network

volumes:
  postgres_data:
  redis_data:

networks:
  secgenie-network:
    driver: bridge