[project]
name = "secgenie-ai"
version = "0.1.0"
description = "AI Powered Multi-Agent Cybersecurity Investigation Platform"
authors = [
    { name = "Harikrishna Panneerselvam" }
]
readme = "README.md"
requires-python = ">=3.12,<4.0"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0"
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<1.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = [
    "UP042",
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]